<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520" role="img" aria-label="Wind turbines, solar panels and a water droplet releasing hydrogen bubbles over green hills" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4f6e7"/>
      <stop offset="0.7" stop-color="#f1fbf7"/>
      <stop offset="1" stop-color="#f8fcfa"/>
    </linearGradient>
    <linearGradient id="drop" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5fd6d8"/>
      <stop offset="1" stop-color="#009b72"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="1" stop-color="#ffe27a"/>
    </radialGradient>
    <g id="turbine">
      <path d="M-5 0 L-8 230 H8 L5 0 Z" fill="#ffffff" stroke="#bfe9d8" stroke-width="2"/>
      <g fill="#ffffff" stroke="#9fd9c3" stroke-width="2" stroke-linejoin="round">
        <path id="blade" d="M0 0 L-7 -12 L0 -110 L7 -12 Z"/>
        <use href="#blade" transform="rotate(120)"/>
        <use href="#blade" transform="rotate(240)"/>
      </g>
      <circle r="9" fill="#009b72"/>
    </g>
  </defs>

  <rect width="1600" height="520" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="1330" cy="130" r="120" fill="#ffe27a" opacity="0.18"/>
  <circle cx="1330" cy="130" r="88" fill="#ffe27a" opacity="0.28"/>
  <circle cx="1330" cy="130" r="58" fill="url(#sun)"/>

  <!-- distant hills -->
  <path d="M0 330 C180 270 340 300 520 320 C720 342 880 270 1080 290 C1260 308 1440 270 1600 300 V520 H0 Z" fill="#cfeee2"/>

  <!-- wind turbines on far hills -->
  <g transform="translate(250 190) scale(0.8)"><use href="#turbine" transform="rotate(14)"/></g>
  <g transform="translate(470 215) scale(0.62)"><use href="#turbine" transform="rotate(48)"/></g>
  <g transform="translate(1090 205) scale(0.7)"><use href="#turbine" transform="rotate(80)"/></g>
  <g transform="translate(1480 235) scale(0.52)"><use href="#turbine" transform="rotate(30)"/></g>

  <!-- mid hills -->
  <path d="M0 380 C200 340 380 372 580 392 C800 414 1000 350 1220 366 C1400 380 1500 360 1600 352 V520 H0 Z" fill="#8bd6bb"/>

  <!-- water droplet releasing hydrogen -->
  <g>
    <path d="M800 190 C800 190 722 292 722 346 C722 392 756 420 800 420 C844 420 878 392 878 346 C878 292 800 190 800 190 Z" fill="url(#drop)"/>
    <path d="M762 342 C762 318 776 294 790 274" stroke="#ffffff" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.55"/>
    <!-- bubbles rising -->
    <g fill="#ffffff" stroke="#009b72" stroke-width="3">
      <circle cx="790" cy="150" r="12"/>
      <circle cx="828" cy="112" r="9"/>
      <circle cx="778" cy="84" r="7"/>
      <circle cx="812" cy="52" r="5"/>
    </g>
    <g fill="#009b72" opacity="0.35">
      <circle cx="858" cy="170" r="6"/>
      <circle cx="748" cy="128" r="5"/>
    </g>
  </g>

  <!-- front hills -->
  <path d="M0 430 C220 396 420 428 640 440 C860 452 1060 400 1280 414 C1430 424 1520 410 1600 402 V520 H0 Z" fill="#2fa586"/>
  <path d="M0 480 C260 454 520 480 800 484 C1080 488 1340 456 1600 470 V520 H0 Z" fill="#0d7a5f"/>

  <!-- solar panels on front hill -->
  <g>
    <g fill="#173b35">
      <path d="M1050 428 L1130 416 L1146 454 L1062 466 Z"/>
      <path d="M1160 424 L1240 414 L1256 452 L1172 462 Z"/>
      <path d="M1270 424 L1350 416 L1366 452 L1282 460 Z"/>
    </g>
    <g stroke="#32b8bc" stroke-width="2" fill="none" opacity="0.9">
      <path d="M1076 422 L1090 460 M1103 419 L1118 457"/>
      <path d="M1186 419 L1200 457 M1213 416 L1228 454"/>
      <path d="M1296 420 L1310 456 M1323 418 L1338 454"/>
      <path d="M1056 447 L1136 435 M1166 443 L1246 433 M1276 442 L1356 435"/>
    </g>
  </g>

  <!-- small rising hydrogen bubbles near foreground -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="260" cy="470" r="6"/>
    <circle cx="300" cy="450" r="4"/>
    <circle cx="520" cy="476" r="5"/>
    <circle cx="1450" cy="468" r="6"/>
    <circle cx="1490" cy="446" r="4"/>
  </g>
</svg>
