<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520" role="img" aria-label="Hydrogen chain: electrolyzer, storage tanks, fuel cell stack and a hydrogen bus" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4f6e7"/>
      <stop offset="1" stop-color="#f8fcfa"/>
    </linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#009b72"/>
      <stop offset="0.45" stop-color="#32b8bc"/>
      <stop offset="1" stop-color="#009b72"/>
    </linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12806a"/>
      <stop offset="1" stop-color="#0d6a58"/>
    </linearGradient>
    <g id="h2">
      <circle cx="0" cy="0" r="9"/>
      <circle cx="13" cy="0" r="9"/>
    </g>
  </defs>

  <rect width="1600" height="520" fill="url(#sky)"/>

  <!-- floating hydrogen molecules -->
  <g fill="#ffffff" opacity="0.75">
    <use href="#h2" x="90" y="90"/>
    <use href="#h2" x="420" y="60"/>
    <use href="#h2" x="640" y="120"/>
    <use href="#h2" x="880" y="70"/>
    <use href="#h2" x="1130" y="110"/>
    <use href="#h2" x="1400" y="60"/>
    <use href="#h2" x="1530" y="150"/>
  </g>
  <g fill="#009b72" opacity="0.18">
    <use href="#h2" x="250" y="140"/>
    <use href="#h2" x="760" y="40"/>
    <use href="#h2" x="1010" y="160"/>
    <use href="#h2" x="1280" y="150"/>
  </g>

  <!-- ground -->
  <rect y="430" width="1600" height="90" fill="#bfe9d8"/>
  <rect y="430" width="1600" height="8" fill="#9fd9c3"/>

  <!-- hydrogen pipe running behind every unit -->
  <path d="M330 330 H1230" stroke="#173b35" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M330 330 H1230" stroke="#7fd1b3" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 22" fill="none"/>

  <!-- electrolyzer -->
  <g>
    <rect x="110" y="240" width="230" height="190" rx="16" fill="url(#unit)"/>
    <rect x="110" y="240" width="230" height="26" rx="16" fill="#0a5445"/>
    <rect x="132" y="284" width="186" height="104" rx="10" fill="#d4f6e7"/>
    <rect x="132" y="284" width="93" height="104" rx="10" fill="#bfe9d8"/>
    <g fill="#ffffff" stroke="#32b8bc" stroke-width="2">
      <circle cx="160" cy="364" r="7"/>
      <circle cx="182" cy="340" r="10"/>
      <circle cx="165" cy="312" r="6"/>
      <circle cx="205" cy="322" r="8"/>
      <circle cx="270" cy="350" r="9"/>
      <circle cx="290" cy="318" r="6"/>
      <circle cx="252" cy="306" r="7"/>
    </g>
    <rect x="225" y="284" width="3" height="104" fill="#009b72"/>
    <circle cx="148" cy="410" r="5" fill="#7fd1b3"/>
    <circle cx="170" cy="410" r="5" fill="#7fd1b3"/>
    <rect x="260" y="403" width="58" height="10" rx="5" fill="#7fd1b3"/>
  </g>

  <!-- storage tanks -->
  <g>
    <rect x="500" y="205" width="96" height="225" rx="48" fill="url(#tank)"/>
    <rect x="620" y="205" width="96" height="225" rx="48" fill="url(#tank)"/>
    <rect x="740" y="205" width="96" height="225" rx="48" fill="url(#tank)"/>
    <g fill="#ffffff" opacity="0.45">
      <rect x="520" y="235" width="10" height="150" rx="5"/>
      <rect x="640" y="235" width="10" height="150" rx="5"/>
      <rect x="760" y="235" width="10" height="150" rx="5"/>
    </g>
    <g fill="#12332e">
      <rect x="538" y="190" width="20" height="22" rx="4"/>
      <rect x="658" y="190" width="20" height="22" rx="4"/>
      <rect x="778" y="190" width="20" height="22" rx="4"/>
    </g>
    <rect x="490" y="395" width="356" height="14" rx="7" fill="#173b35"/>
  </g>

  <!-- fuel cell stack -->
  <g>
    <rect x="930" y="250" width="22" height="180" rx="6" fill="#173b35"/>
    <g fill="#32b8bc">
      <rect x="958" y="262" width="16" height="156" rx="3"/>
      <rect x="980" y="262" width="16" height="156" rx="3"/>
      <rect x="1002" y="262" width="16" height="156" rx="3"/>
      <rect x="1024" y="262" width="16" height="156" rx="3"/>
      <rect x="1046" y="262" width="16" height="156" rx="3"/>
      <rect x="1068" y="262" width="16" height="156" rx="3"/>
    </g>
    <g fill="#d4f6e7">
      <rect x="974" y="262" width="6" height="156"/>
      <rect x="996" y="262" width="6" height="156"/>
      <rect x="1018" y="262" width="6" height="156"/>
      <rect x="1040" y="262" width="6" height="156"/>
      <rect x="1062" y="262" width="6" height="156"/>
    </g>
    <rect x="1090" y="250" width="22" height="180" rx="6" fill="#173b35"/>
    <rect x="918" y="416" width="206" height="14" rx="7" fill="#0a5445"/>
    <!-- power bolt -->
    <path d="M1020 190 L1000 232 H1018 L1008 268 L1044 216 H1024 Z" fill="#ffd95a" stroke="#e0b52e" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- hydrogen bus -->
  <g>
    <rect x="1220" y="300" width="300" height="120" rx="22" fill="#ffffff" stroke="#173b35" stroke-width="4"/>
    <rect x="1220" y="378" width="300" height="42" rx="0" fill="#32b8bc"/>
    <rect x="1220" y="384" width="300" height="36" rx="18" fill="#009b72"/>
    <g fill="#bfe9d8" stroke="#173b35" stroke-width="3">
      <rect x="1246" y="324" width="52" height="42" rx="6"/>
      <rect x="1312" y="324" width="52" height="42" rx="6"/>
      <rect x="1378" y="324" width="52" height="42" rx="6"/>
      <rect x="1444" y="316" width="58" height="50" rx="8"/>
    </g>
    <!-- roof hydrogen tanks -->
    <rect x="1250" y="274" width="110" height="26" rx="13" fill="url(#tank)"/>
    <rect x="1372" y="274" width="110" height="26" rx="13" fill="url(#tank)"/>
    <g fill="#173b35">
      <circle cx="1300" cy="424" r="26"/>
      <circle cx="1450" cy="424" r="26"/>
    </g>
    <g fill="#d4f6e7">
      <circle cx="1300" cy="424" r="11"/>
      <circle cx="1450" cy="424" r="11"/>
    </g>
  </g>
</svg>
